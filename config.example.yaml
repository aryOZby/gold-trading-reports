timezone: Asia/Jerusalem

# Written by the Chart Executor EA (closed.csv, open.csv, unfilled.csv), one folder per MT5 account.
# Use the account number of the account to report on, e.g. ...\gt_journal\12345678.
journal_dir: C:\Users\Administrator\AppData\Roaming\MetaQuotes\Terminal\Common\Files\gt_journal\<account number>
reports_dir: reports

# A stop closed within this distance of the entry counts as breakeven (XAUUSD pip = 0.1).
breakeven_tolerance: 0.1
# Closes by the EA from this time on Friday (Israel) are the weekly Friday close.
friday_close: "23:30"

# Slot number (G in the trade comment) -> group name used in file names and tables.
groups:
  1: VIP SIGNALS ROOM (LIFETIME)
  2: Technical Pips
  3: profit__kings
  4: GOLD SNIPER
  5: Trade With Samder
  6: GOLD BULLET SIGNALS
  7: Alphabet Forex

# One Google sign-in for Gmail and Drive. One-time setup: scripts\authorize_google.py (see README).
google:
  client_file: secrets/google_client.json
  token_file: secrets/google_token.json

email:
  enabled: true
  method: gmail_api   # gmail_api = send as the signed-in Google account; smtp = App Password below
  to: []              # one or more recipients
  sender: ""          # optional From; gmail_api defaults to the signed-in account
  # smtp only — password goes in .env as SMTP_PASSWORD
  smtp_host: smtp.gmail.com
  smtp_port: 587
  username: ""

# Upload the workbooks to Google Drive: <folder>/<YYYY-MM>/, replacing files of the same name.
drive:
  enabled: false
  folder: Gold Trading Reports
